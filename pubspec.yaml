name: hrms
description: "A new Flutter project."


publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.11.5


dependencies:
  flutter:
    sdk: flutter

  
  cupertino_icons: ^1.0.8
  firebase_core: ^4.10.0
  flutter_svg: ^2.0.10+1
  window_manager: ^0.5.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  flutter_launcher_icons: ^0.14.4
  flashy_flushbar: ^1.4.1
  intl: ^0.20.2
  file_picker: ^12.0.0-beta.7
  firebase_storage: ^13.4.2
  pdfx: ^2.9.0
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  share_plus: ^13.2.1
  easy_localization: ^3.0.7
  csv: ^8.0.0
  path_provider: ^2.1.5
  open_file: ^3.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_inappwebview: ^6.1.5
  pdf: ^3.11.0
  image: ^4.8.0
  in_app_review: ^2.0.12
  cloud_functions: ^6.3.5
  archive: ^4.0.9
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.1
  flutter_riverpod: ^2.6.1

flutter_launcher_icons:
  android: true
  ios: true
  macos:
   generate: true
  image_path: "assets/app_icon.png"


dev_dependencies:
  flutter_test:
    sdk: flutter
  
  
  flutter_lints: ^6.0.0


flutter:

  
  uses-material-design: true

  
  assets:
    - assets/
    - assets/translations/
    - assets/fonts/

  

  
  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SFPRODISPLAYREGULAR.OTF
        - asset: assets/fonts/SFPRODISPLAYMEDIUM.OTF
          weight: 500
        - asset: assets/fonts/SFPRODISPLAYSEMIBOLDITALIC.OTF
          style: italic
          weight: 600
        - asset: assets/fonts/SFPRODISPLAYLIGHTITALIC.OTF
          style: italic
          weight: 300
    - family: SF Pro
      fonts:
        - asset: assets/fonts/SF-Pro.ttf
